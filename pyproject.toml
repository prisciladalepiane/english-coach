[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "english-conversation-coach"
version = "0.1.0"
description = "Parceiro de conversacao em ingles com Qwen3, GGUF e Streamlit."
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "huggingface-hub>=0.34,<2",
    "llama-cpp-python>=0.3,<1",
    "python-dotenv>=1,<2",
    "pyyaml>=6,<7",
    "streamlit>=1.48,<2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<10",
    "ruff>=0.12,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/english_coach"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py311"
